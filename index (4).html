<title>6학년 6반 피드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 가운데 470px 단일 피드 컬럼, 상단 고정 바, 프로필 → 새 게시물 작성 → 게시물 카드와 댓글 스레드 */
:root{
  --bg:#f6f5f2; --card:#ffffff; --fg:#1d1c1a; --muted:#77736b; --line:#e4e1da;
  --accent:#d6336c; --ai:#4c6ef5; --ai-soft:#edf0ff; --chip:#efece6;
  --display:"Gowun Batang", Georgia, serif;
  --body:"IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --card:#1b1b1a; --fg:#f0eee9; --muted:#9a968e; --line:#2d2c29;
  --accent:#ff6b9a; --ai:#8ea2ff; --ai-soft:#1f2440; --chip:#262522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1b1b1a; --fg:#f0eee9; --muted:#9a968e; --line:#2d2c29;
  --accent:#ff6b9a; --ai:#8ea2ff; --ai-soft:#1f2440; --chip:#262522; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:470px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:-.5px}
.top-r{display:flex;align-items:center;gap:12px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:#2fb344}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.feed{max-width:470px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.profile{display:flex;align-items:center;gap:18px}
.pav{width:76px;height:76px;border-radius:50%;flex:none;background:conic-gradient(from 200deg,#f59f00,#d6336c,#7048e8,#f59f00);padding:3px}

.pbio{font-size:13px;color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:6px;padding:12px 14px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}

.c-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.preview{aspect-ratio:1/1;max-width:100%;border-radius:8px;display:grid;place-items:center;text-align:center;padding:28px;overflow:hidden;position:relative}
.preview p{font-family:var(--display);font-size:clamp(18px,5.5vw,26px);line-height:1.45;margin:0;white-space:pre-wrap;word-break:break-word;text-wrap:balance}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preview .ph-empty{color:var(--muted);font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--card) inset}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}

.c-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* posts */
.post{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ph .who{flex:1;min-width:0}

.av.ai{background:conic-gradient(from 200deg,#f59f00,#d6336c,#7048e8,#f59f00);padding:2px;box-sizing:border-box}

.ph .name{font-weight:600}

.more{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;padding:4px 6px}
.badge{font-size:10px;font-weight:600;color:var(--ai);background:var(--ai-soft);border-radius:4px;padding:1px 5px;margin-left:4px;letter-spacing:.3px}
.img{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;padding:36px;text-align:center;position:relative;user-select:none;overflow:hidden}
.img.photo{padding:0;background:var(--chip)}
.img.photo img{width:100%;height:100%;object-fit:cover;display:block}
.img p{font-family:var(--display);font-size:clamp(20px,6vw,28px);line-height:1.45;text-wrap:balance;margin:0;white-space:pre-wrap;word-break:break-word}
.img small{position:absolute;bottom:16px;left:0;right:0;font-size:11px;letter-spacing:2px;opacity:.7}
.heart-pop{position:absolute;font-size:90px;opacity:0;pointer-events:none;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.heart-pop.go{animation:pop .8s ease}
@keyframes pop{0%{opacity:0;transform:scale(.3)}20%{opacity:.95;transform:scale(1.1)}60%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

.comments{padding:4px 14px 6px;display:flex;flex-direction:column;gap:12px}

.typing{color:var(--muted);font-style:italic}
.empty{color:var(--muted);font-size:13px}

.rnum{width:24px;height:24px;border-radius:50%;background:var(--chip);color:var(--fg);font-weight:600;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rsec h4{margin:1px 0 2px;font-size:13px;font-weight:600}
.rsec .q{font-size:12px;color:var(--muted);margin-bottom:3px}
.rsec .a{white-space:pre-wrap;word-break:break-word;min-width:0}

.rules-old{background:var(--ai-soft);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.rules-old b{font-size:12px;color:var(--ai)}
.rfields{display:flex;flex-direction:column;gap:12px}
.rfields .q{font-size:12px;color:var(--muted)}
.rule-hint{font-size:11.5px;color:var(--muted);padding:0 14px 8px}
.rules{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.rules .rh{font-size:12px;font-weight:600;color:var(--muted)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:7px;background:#1f2038;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.rchip svg{width:16px;height:16px;color:#f2c14e;flex:none}
.rule-chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px}
.rule-chips .rchip{padding:5px 9px;font-size:11.5px;font-weight:500}
.rule-chips .rchip svg{width:13px;height:13px}
.steps{display:flex;gap:4px;padding-top:2px}
.steps span{flex:1;height:4px;border-radius:2px}
.feed-empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:32px 20px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--chip);font-size:13px}
.confirm button{border:0;border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.confirm .yes{background:var(--accent);color:#fff}
.confirm .no{background:var(--card);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--card);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}
@media (prefers-reduced-motion: reduce){.heart-pop.go{animation:none}}
</style>

/* ---------- 공유 저장소 ---------- */
let fs=null;               // Firestore (연결되면)
let store={posts:[],comments:[],likes:[]};
const online = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.projectId && window.firebase);
function loadLocal(){ try{ const o=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null"); if(o){ store.posts=o.posts||[]; store.comments=o.comments||[]; store.likes=(o.likes||[]).map(x=>typeof x==="string"?{id:x+"_"+prefs.device,post:x,device:prefs.device}:x); } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LOCAL_KEY,JSON.stringify(store)); return true; }catch(e){ toast("저장 공간이 가득 찼어요. 오래된 사진 게시물을 지워주세요."); return false; } }
async function put(col,obj){
  if(fs){ await fs.collection(col).doc(obj.id).set(obj); return; }
  store[col]=store[col].filter(x=>x.id!==obj.id).concat(obj);
  if(!saveLocal()){ store[col]=store[col].filter(x=>x.id!==obj.id); throw new Error("저장 공간이 가득 찼어요"); }
  onData();
}
async function del(col,id){
  if(fs){ await fs.collection(col).doc(id).delete(); return; }
  store[col]=store[col].filter(x=>x.id!==id); saveLocal(); onData();
}

function renderSwatches(){

function renderPreview(){
  const pv=$("#preview");
  if(draft.kind==="photo"){
    pv.style.background="var(--chip)"; pv.style.color="";
    pv.innerHTML=draft.dataUrl?`<img src="${draft.dataUrl}" alt="올릴 사진 미리보기">`:`<span class="ph-empty">사진을 고르면 여기에 보여요</span>`;
  }else{
    const c=COLORS[draft.color]; pv.style.background=c.bg; pv.style.color=c.fg;
    const t=$("#cardText").value.trim();
    pv.innerHTML=`<p>${t?esc(t):'<span style="opacity:.5">글을 입력해 보세요</span>'}</p>`;
  }
  $("#shareBtn").disabled = draft.kind==="report" ? REPORT.some(r=>!$("#r-"+r.k).value.trim())
    : draft.kind==="photo" ? !draft.dataUrl : !$("#cardText").value.trim();
  $("#cHint").textContent = draft.kind==="report" ? `${REPORT.filter(r=>$("#r-"+r.k).value.trim()).length}/${REPORT.length}칸 작성` : "";
}
function setKind(k){
  draft.kind=k;
  $("#tabReport").setAttribute("aria-pressed",k==="report"); $("#tabText").setAttribute("aria-pressed",k==="text"); $("#tabPhoto").setAttribute("aria-pressed",k==="photo");
  $("#textOpts").hidden=k!=="text"; $("#photoOpts").hidden=k!=="photo";
  $("#reportOpts").hidden=k!=="report"; $("#preview").hidden=k==="report"; $("#captionField").hidden=k==="report";

}

// 사진은 저장 공간을 아끼려고 가로 900px JPEG로 줄여서 보관
$("#photoInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{
    const s=Math.min(1,900/Math.max(img.width,img.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    draft.dataUrl=cv.toDataURL("image/jpeg",0.75); URL.revokeObjectURL(url);
    $("#photoLabel").textContent=f.name; renderPreview();
  };
  img.onerror=()=>toast("이 사진은 열 수 없어요. 다른 사진을 골라주세요.");
  img.src=url;
});
$("#shareBtn").onclick=async()=>{
  const btn=$("#shareBtn"); btn.disabled=true; btn.textContent="올리는 중…";
  const p={id:uid("p"), kind:draft.kind, caption:$("#caption").value.trim(), author:me(), device:prefs.device, at:Date.now()};
  if(draft.kind==="report"){ p.report={}; REPORT.forEach(r=>p.report[r.k]=$("#r-"+r.k).value.trim()); }
  else if(draft.kind==="text"){ p.text=$("#cardText").value.trim(); p.color=draft.color; } else p.img=draft.dataUrl;
  try{
    await put("posts",p);
    $("#cardText").value=""; $("#caption").value=""; REPORT.forEach(r=>$("#r-"+r.k).value=""); $("#photoInput").value=""; $("#photoLabel").textContent="사진 고르기";
    draft={kind:draft.kind,color:draft.color,dataUrl:null};
    $("#composer").hidden=true; toast("게시했어요"); window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){ console.warn(err); toast("게시하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요."); }
  btn.textContent="공유하기"; renderPreview();
};

function commentHTML(c, postId){

  const isTyping=typing[postId]===c.id;
  const canDel=isTeacher()||(c.device&&c.device===prefs.device);
  return `<div class="cm">${avatarOf(c)}<div class="cm-body">
    <div class="cm-text"><b>${esc(c.ai?ACCOUNT:c.author)}</b>${c.ai?'<span class="badge">AI</span> ':''}${esc(c.text)}</div>
    <div class="cm-meta"><span>${ago(c.at)}</span>${c.parent?'':`<button type="button" data-reply="${c.id}" data-post="${postId}">답글 달기</button>`}${canDel?`<button type="button" data-cdel="${c.id}">지우기</button>`:""}</div>
    ${(kids.length||isTyping)?`<div class="replies">${kids.map(k=>commentHTML(k,postId)).join("")}${isTyping?typingHTML():""}</div>`:""}
  </div></div>`;
}

  const c=COLORS[p.color||0]||COLORS[0];
  return `<div class="img" data-dbl="${p.id}" style="background:${c.bg};color:${c.fg}"><p>${esc(p.text||"")}</p><small>@6학년6반</small><div class="heart-pop">♥</div></div>`;
}
function tileHTML(p){
  const n=store.comments.filter(c=>c.post===p.id).length, l=store.likes.filter(x=>x.post===p.id).length;
  let body;
  if(p.kind==="report") body=`<div class="t-name">${esc(p.author||"")}</div><div class="t-plan">${esc((p.report||{}).plan||"")}</div>`;
  else if(p.kind==="photo") body=`<img src="${p.img}" alt="">`;
  else { const c=COLORS[p.color||0]||COLORS[0]; body=`<div class="t-card" style="background:${c.bg};color:${c.fg}">${esc(p.text||"")}</div>`; }
  return `<button type="button" class="tile${p.kind==="photo"?" t-photo":""}" data-open="${p.id}">${body}<span class="t-meta">♥ ${l} · 댓글 ${n}</span></button>`;
}

    <div class="likes">좋아요 ${likeN}개</div>
    ${p.caption?`<div class="cap"><b>${ACCOUNT}</b>${esc(p.caption)}</div>`:""}
    <div class="comments">${tops.length?tops.map(c=>commentHTML(c,p.id)).join(""):'<div class="empty">아직 댓글이 없어요. 첫 댓글을 남겨보세요.</div>'}</div>
    ${rt?`<div class="replying">@${esc(rt.ai?ACCOUNT:rt.author)}에게 답글 다는 중 <button type="button" data-cancel="${p.id}">취소</button></div>`:""}
    <form class="form" data-form="${p.id}"><input id="in-${p.id}" placeholder="${rt?'답글 달기…':'댓글 달기…'}" maxlength="300" autocomplete="off" aria-label="댓글 입력"><button type="submit">게시</button></form>
    <div class="rule-chips">${COMMENT_RULES.map(x=>`<span class="rchip">${x.i}${x.t}</span>`).join("")}</div>
  </article>`;
}
function render(){
  const ae=document.activeElement, keep=ae&&ae.closest&&ae.closest("#posts")?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;
  const list=[...store.posts].sort((a,b)=>b.at-a.at);
  const reporters=new Set(list.filter(p=>p.kind==="report").map(p=>p.author));
  $("#postCount").textContent=list.length;
  $("#cmCount").textContent=store.comments.filter(c=>list.some(p=>p.id===c.post)).length;
  $("#reportCount").textContent=`${reporters.size}/${CLASS_SIZE}`;
  $("#vGrid").textContent=`모아보기 ${list.length}`;
  const wrap=$("#posts");
  if(view==="grid"){
    wrap.className="grid";
    wrap.innerHTML=list.length?list.map(tileHTML).join(""):`<div class="feed-empty" style="grid-column:1/-1">아직 올라온 보고서가 없어요.</div>`;
  }else{
    wrap.className="feedlist";
    wrap.innerHTML=guideHTML()+(list.length?list.map(postHTML).join(""):`<div class="feed-empty">아직 게시물이 없어요.<br>오른쪽 위 <b>+ 새 게시물</b>로 첫 글을 올려보세요.</div>`);
  }
  if(keep&&keep.id){const n=document.getElementById(keep.id); if(n){n.value=keep.v; n.focus(); try{n.setSelectionRange(keep.s,keep.s);}catch(e){}}}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t||!t.closest("#posts")) return;
  const d=t.dataset;
  if(d.open){ setView("feed"); const n=document.getElementById("post-"+d.open); if(n) n.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(d.like) toggleLike(d.like);
  if(d.focus) document.getElementById("in-"+d.focus)?.focus();
  if(d.reply){ replyTarget[d.post]=store.comments.find(x=>x.id===d.reply); render(); document.getElementById("in-"+d.post)?.focus(); }
  if(d.cancel){ delete replyTarget[d.cancel]; render(); }
  if(d.del){ confirmDel[d.del]=true; render(); }
  if(d.delno){ delete confirmDel[d.delno]; render(); }
  if(d.delyes){
    delete confirmDel[d.delyes];
    try{ await del("posts",d.delyes); for(const c of store.comments.filter(c=>c.post===d.delyes)) await del("comments",c.id); toast("삭제했어요"); }
    catch(err){ toast("삭제하지 못했어요"); }
  }
  if(d.cdel){
    const ids=[d.cdel,...store.comments.filter(c=>c.parent===d.cdel).map(c=>c.id)];
    try{ for(const id of ids) await del("comments",id); }catch(err){ toast("댓글을 지우지 못했어요"); }
  }
});
document.addEventListener("dblclick",e=>{
  const img=e.target.closest("[data-dbl]"); if(!img) return;
  const id=img.dataset.dbl;
  if(!store.likes.some(x=>x.post===id&&x.device===prefs.device)) toggleLike(id);
  const pop=document.querySelector(`[data-dbl="${id}"] .heart-pop`); if(pop){pop.classList.remove("go"); void pop.offsetWidth; pop.classList.add("go");}
});
async function toggleLike(postId){
  const id=postId+"_"+prefs.device;
  try{ store.likes.some(x=>x.id===id)?await del("likes",id):await put("likes",{id,post:postId,device:prefs.device}); }
  catch(err){ toast("좋아요를 저장하지 못했어요"); }
}
document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  if(!prefs.myName){ toast("먼저 위에서 내 이름을 정해주세요"); $("#nameInput").focus(); return; }
  const postId=f.dataset.form, input=f.querySelector("input"), text=input.value.trim(); if(!text) return;
  const rt=replyTarget[postId]; const parent=rt?(rt.parent||rt.id):null;
  input.value=""; delete replyTarget[postId];
  try{ await put("comments",{id:uid("c"), post:postId, parent, author:me(), device:prefs.device, text, ai:false, at:Date.now()}); }
  catch(err){ input.value=text; toast("댓글을 올리지 못했어요. 다시 눌러주세요."); }
});

/* ---------- AI 답글 ----------
   API 키는 그 키를 넣은 기기(선생님 기기)에만 저장돼요.
   그 기기에서 페이지를 열어 두면, 반 친구들이 새로 단 댓글에 AI가 대신 답글을 달아요. */
const startedAt=Date.now(), handled=new Set();
function checkAI(){
  if(!prefs.apiKey) return;
  const pending=store.comments.filter(c=>!c.ai && c.at>=startedAt-60000 && !handled.has(c.id) && !store.comments.some(a=>a.ai&&a.replyTo===c.id));
  pending.forEach(c=>{ handled.add(c.id); aiReply(c); });
}
async function aiReply(c){
  const postId=c.post, root=c.parent||c.id;
  typing[postId]=root; render();
  const post=store.posts.find(p=>p.id===postId)||{};
  const thread=[store.comments.find(x=>x.id===root), ...store.comments.filter(x=>x.parent===root).sort((a,b)=>a.at-b.at)].filter(Boolean);
  const convo=thread.map(x=>`${x.ai?ACCOUNT+"(너)":x.author}: ${x.text}`).join("\n");
  const what=post.kind==="report"?"[매체 이용 성찰 보고서]\n"+REPORT.map(r=>`${r.t}: ${(post.report||{})[r.k]||""}`).join("\n"):post.kind==="photo"?"(사진 게시물. 사진 내용은 볼 수 없으니 설명을 참고해라)":`[카드 문구] ${post.text||""}`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":prefs.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:AI_MODEL,max_tokens:300,system:AI_PERSONA,
        messages:[{role:"user",content:`[게시물] ${post.author?"(올린 사람: "+post.author+")":""}\n${what}\n[설명] ${post.caption||"(없음)"}\n\n[댓글 스레드]\n${convo}\n\n위 스레드에서 ${c.author}의 마지막 댓글에 ${ACCOUNT} 계정으로서 답글 하나만 써라. 답글 본문만 출력한다.`}]})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(r.status===401?"API 키가 맞지 않아요. 설정에서 다시 확인해 주세요.":(data.error&&data.error.message)||"AI 응답을 받지 못했어요");
    const reply=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
    delete typing[postId];
    if(reply) await put("comments",{id:uid("a"), post:postId, parent:root, replyTo:c.id, author:"ai", device:prefs.device, text:reply, ai:true, at:Date.now()});
  }catch(err){ toast(err.message||"AI 답글을 달지 못했어요"); }
  delete typing[postId]; render();
}

/* ---------- 시작 ---------- */
function onData(){ render(); checkAI(); }
renderSwatches(); renderPreview(); renderNamebar();
if(online){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fs=firebase.firestore();
    ["posts","comments","likes"].forEach(col=>{
      fs.collection(col).onSnapshot(snap=>{ store[col]=snap.docs.map(d=>d.data()); onData(); },
        err=>{ console.warn(err); toast(err.code==="permission-denied"?"Firebase 규칙에서 읽기·쓰기를 허용해 주세요":"연결이 끊겼어요. 새로고침해 주세요."); });
    });
    // 예전 버전에서 이 기기에만 저장해 둔 글·댓글이 있으면 한 번만 반 전체 피드로 옮김
    if(!prefs.migrated){
      try{
        const o=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");
        if(o){
          (o.posts||[]).forEach(x=>fs.collection("posts").doc(x.id).set({...x,device:x.device||prefs.device}));
          (o.comments||[]).forEach(x=>fs.collection("comments").doc(x.id).set({...x,device:x.device||prefs.device}));
          if((o.posts||[]).length) toast("이 기기에 저장된 글을 반 피드로 옮겼어요");
        }
        prefs.migrated=true; savePrefs();
      }catch(e){ console.warn(e); }
    }
  }catch(err){ console.warn(err); fs=null; loadLocal(); toast("Firebase 설정을 확인해 주세요. 지금은 이 기기에만 저장돼요."); }
}else{
  loadLocal();
  $("#localBanner").hidden=false;
}
setStatus(); render();
setInterval(()=>{ const a=document.activeElement; if(!a||!/INPUT|TEXTAREA/.test(a.tagName)) render(); },60000);
</script>
